<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menüplan Prototyp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700&family=Lora:wght@600&display=swap" rel="stylesheet">
<style>
/* Layout: Werkzeugleiste links, Handy-Rahmen zentriert. Tokens aus dem MenüplanApp Design System (nur hell). */
:root {
  --green: #5CB84B; --green-d: #3E8A32; --link: #2F7A2A; --anth: #1E2C31; --mint: #9ED98C;
  --bg: #F4F8F0; --bg2: #E4EFDD; --line: #DCEBD5; --text: #1E2C31; --text2: #4B5D57; --muted: #8FA79E;
  --badge: #2F5A2A; --on-dark2: #B9CBC5; --surface: #FBFDF9;
  --warn-bg: #F7EFCF; --warn: #6B5410; --err: #B3402F; --err-bg: #F8E3DE; --ok-bg: #DCF0D3;
  --page: #DDE7D6;
  --f-d: 'Lora', Georgia, serif; --f-b: 'Libre Franklin', system-ui, -apple-system, sans-serif;
  --r-sm: 8px; --r-md: 16px; --r-lg: 24px; --shadow: 0 8px 24px rgba(30,44,49,0.14);
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--page); color: var(--text); font-family: var(--f-b); font-size: 15px; line-height: 1.5; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .45; }
:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
.tnum { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.page { display: flex; gap: 32px; align-items: flex-start; justify-content: center; padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-height: 100%; }

/* Werkzeugleiste */
.toolbar { width: 300px; flex: 0 0 300px; background: var(--anth); color: #F4F8F0; border-radius: var(--r-lg); padding: 20px; display: flex; flex-direction: column; gap: 8px; position: sticky; top: 24px; font-size: 13px; box-shadow: var(--shadow); }
.tb-brand { display: flex; flex-direction: column; margin-bottom: 6px; }
.tb-eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--mint); font-weight: 600; }
.tb-title { font-family: var(--f-d); font-size: 22px; font-weight: 600; }
.tb-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 32px; }
.tb-seg { display: flex; background: rgba(255,255,255,.08); border-radius: 999px; padding: 2px; }
.tb-seg button { background: none; border: 0; color: var(--on-dark2); padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.tb-seg button.on { background: var(--green); color: var(--anth); }
.tb-sub { margin-top: 8px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--mint); }
.tb-actions { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.tb-btn { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); color: #F4F8F0; border-radius: 999px; padding: 8px 12px; font-size: 12px; font-weight: 600; }
.tb-info { margin-top: 8px; background: rgba(255,255,255,.06); border-radius: var(--r-md); padding: 10px 12px; }
.tb-info summary { font-weight: 600; color: var(--mint); cursor: pointer; }
.tb-info p { margin: 6px 0 0; color: var(--on-dark2); }
.tb-info strong { color: #F4F8F0; }
.tb-tip { color: var(--on-dark2); font-size: 12px; }

/* Handy */
.stage { flex: 0 0 auto; }
.phone { position: relative; width: 390px; height: 844px; background: var(--bg); border-radius: 48px; overflow: hidden; box-shadow: 0 0 0 10px var(--anth), 0 24px 60px rgba(30,44,49,.35); display: flex; flex-direction: column; }
.notch { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 110px; height: 28px; background: var(--anth); border-radius: 999px; z-index: 50; }
.statusbar { height: 48px; flex: 0 0 48px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 28px 6px; font-size: 13px; font-weight: 600; }
.content { flex: 1; overflow-y: auto; overflow-x: hidden; }
.screen { padding: 8px 20px 28px; display: flex; flex-direction: column; gap: 14px; }

@media (max-width: 760px) {
  .page { flex-direction: column; align-items: center; gap: 20px; }
  .toolbar { width: 100%; flex: none; max-width: 420px; position: static; }
  .phone { width: min(390px, 100%); height: 780px; border-radius: 32px; box-shadow: 0 0 0 6px var(--anth), 0 16px 40px rgba(30,44,49,.3); }
  .stage { width: 100%; display: flex; justify-content: center; }
}

/* Typo */
.h1 { font-family: var(--f-d); font-size: 28px; font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; }
.h2 { font-family: var(--f-d); font-size: 21px; font-weight: 600; line-height: 1.2; margin: 0; text-wrap: balance; }
.display { font-family: var(--f-d); font-size: 34px; font-weight: 600; line-height: 1.12; margin: 0; text-wrap: balance; }
.display.sm { font-size: 28px; }
.eyebrow, .lbl { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--link); font-weight: 600; }
.lbl { display: block; margin-top: 4px; }
.lead { font-size: 17px; color: var(--text2); margin: 0; }
.muted { color: var(--text2); margin: 0; }
.small { font-size: 13px; }
.goal { font-size: 12px; color: var(--muted); background: transparent; border: 1px dashed var(--line); border-radius: var(--r-sm); padding: 4px 8px; }
.hdr { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding-top: 6px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack.sm { gap: 8px; }
.row { display: flex; gap: 8px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.center { text-align: center; }

/* Buttons */
.btn { border: 0; border-radius: 999px; padding: 14px 24px; font-size: 15px; font-weight: 600; min-height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; transition: background .15s; }
.btn.small { padding: 9px 16px; min-height: 40px; font-size: 14px; }
.btn.btn-full { width: 100%; }
.btn-primary { background: var(--green); color: var(--anth); }
.btn-primary:hover:not(:disabled) { background: #6CC75B; }
.btn-ghost { background: var(--bg2); color: var(--anth); }
.btn-ghost:hover:not(:disabled) { background: var(--line); }
.btn-text { background: none; color: var(--link); padding-inline: 8px; }
.btn-on-dark { background: rgba(255,255,255,.1); color: #F4F8F0; border: 1px solid rgba(255,255,255,.2); }
.btn-danger { background: var(--err); color: #fff; }
.icon-btn { width: 44px; height: 44px; border-radius: 999px; border: 0; background: var(--bg2); font-size: 18px; flex: 0 0 44px; display: grid; place-items: center; }
.icon-btn.sm { width: 36px; height: 36px; flex-basis: 36px; background: transparent; }

/* Chips / Badges */
.chips-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.chips-row.wrap { flex-wrap: wrap; overflow: visible; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; background: var(--bg2); color: var(--badge); font-size: 14px; font-weight: 600; white-space: nowrap; min-height: 38px; }
.chip.click { cursor: pointer; }
.chip.active { background: var(--anth); color: #F4F8F0; }
.chip.neg { background: var(--err-bg); color: var(--err); }
.chip.ok { background: var(--ok-bg); }
.chip-x { border: 0; background: rgba(30,44,49,.1); width: 22px; height: 22px; border-radius: 999px; font-size: 14px; line-height: 1; padding: 0; }
.badge { display: inline-flex; align-items: center; background: var(--bg2); color: var(--badge); font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 999px; white-space: nowrap; }
.badge.dark { background: var(--anth); color: var(--mint); }
.badge.exp { background: var(--warn-bg); color: var(--warn); }
.tag { font-size: 12px; color: var(--badge); background: var(--ok-bg); padding: 2px 8px; border-radius: 999px; }
.tm { font-size: 12px; font-weight: 600; background: var(--anth); color: var(--mint); padding: 4px 10px; border-radius: 999px; }
.tmchips { margin-top: 6px; gap: 6px; }

/* Banner */
.banner { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: var(--r-md); font-size: 14px; }
.banner.info { background: var(--bg2); color: var(--text); }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.err { background: var(--err-bg); color: var(--err); }
.banner.ok { background: var(--ok-bg); color: var(--badge); }
.banner-txt { flex: 1; min-width: 0; }

/* Woche */
.weeksel { display: flex; align-items: center; gap: 8px; }
.mini-grid { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.mini { height: 36px; border-radius: 6px; background: var(--bg2); display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--text2); }
.mini.filled { background: var(--mint); color: var(--anth); }
.ai-card { background: var(--anth); color: #F4F8F0; border-radius: var(--r-lg); padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); }
.ai-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.ai-lbl { font-size: 12px; font-weight: 600; color: var(--mint); }
.ai-title { font-family: var(--f-d); font-size: 21px; font-weight: 600; line-height: 1.2; }
.ai-title.big { font-size: 28px; }
.ai-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.ai-quota { font-size: 12px; color: var(--on-dark2); }
.quota { font-size: 12px; color: var(--text2); }
.hint-line { font-size: 12px; color: var(--muted); text-align: center; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 6px 6px 6px; position: relative; }
.day-head { display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 10px; }
.day-name { font-size: 14px; white-space: nowrap; }
.day-ev { flex: 1; display: flex; gap: 6px; overflow-x: auto; min-width: 0; }
.ev { font-size: 12px; background: var(--warn-bg); color: var(--warn); padding: 3px 8px; border-radius: 999px; white-space: nowrap; font-weight: 600; }
.slot { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; cursor: pointer; user-select: none; -webkit-user-select: none; min-height: 60px; }
.slot:hover { background: var(--bg2); }
.slot:active { background: var(--line); }
.slot-lbl { width: 48px; flex: 0 0 48px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.slot-main { min-width: 0; flex: 1; }
.slot-name { font-weight: 600; font-size: 15px; line-height: 1.3; }
.slot-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--text2); }
.slot-meta .note { color: var(--link); }
.slot-empty { color: var(--link); font-weight: 600; }
.tile { border-radius: 12px; display: grid; place-items: center; flex: 0 0 auto; }
.day-menu { position: absolute; right: 8px; top: 44px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow); display: flex; flex-direction: column; z-index: 5; overflow: hidden; min-width: 200px; }
.day-menu button { text-align: left; background: none; border: 0; padding: 12px 16px; min-height: 44px; font-weight: 600; }
.day-menu button:hover { background: var(--bg2); }
.finalize { display: flex; flex-direction: column; gap: 10px; padding-top: 6px; }

.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 28px 8px; }
.empty .stack { width: 100%; }
.empty-art { font-size: 48px; line-height: 1; }

/* Listen */
.import-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.imp { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; position: relative; min-height: 76px; }
.imp span { font-size: 22px; }
.imp em { position: absolute; top: 6px; right: 6px; font-style: normal; font-size: 10px; background: var(--warn-bg); color: var(--warn); padding: 1px 6px; border-radius: 999px; }
.input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; font: inherit; font-size: 15px; color: var(--text); min-height: 48px; }
.input:focus { outline: 2px solid var(--green); border-color: transparent; }
.input.ta { resize: vertical; line-height: 1.5; }
.input.ta.sm { font-size: 14px; min-height: 0; }
.input.narrow { width: 90px; }
.list { display: flex; flex-direction: column; gap: 6px; }
.rrow { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 12px; text-align: left; min-height: 64px; width: 100%; }
.rrow:hover { border-color: var(--mint); }
.rrow-main { flex: 1; min-width: 0; }
.rrow-name { font-weight: 600; }
.chev { color: var(--muted); font-size: 20px; }
.coll-row { display: flex; gap: 6px; flex-wrap: wrap; }
.coll { font-size: 13px; background: var(--anth); color: var(--mint); border-radius: 999px; padding: 4px 12px; font-weight: 600; }

/* Einkauf */
.dept { display: flex; flex-direction: column; gap: 2px; }
.dept-h { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--link); font-weight: 600; padding: 10px 4px 4px; }
.item { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--surface); border-radius: 12px; padding: 4px 8px; }
.item.have .item-name { color: var(--text2); }
.item.done .item-name { text-decoration: line-through; color: var(--muted); }
.check { width: 32px; height: 32px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); flex: 0 0 32px; font-weight: 700; color: var(--anth); }
.check.on { background: var(--green); border-color: var(--green); }
.item-main { flex: 1; display: flex; align-items: center; gap: 8px; background: none; border: 0; text-align: left; min-height: 44px; padding: 0; min-width: 0; }
.item-name { font-weight: 600; flex: 1; }
.item-qty { color: var(--text2); font-size: 14px; font-variant-numeric: tabular-nums; }
.item-src { width: 100%; padding: 0 0 8px 42px; font-size: 13px; color: var(--link); }

/* Konto */
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-h { font-family: var(--f-d); font-size: 19px; font-weight: 600; }
.members { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.member { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 14px; font-weight: 600; }
.avatar { width: 48px; height: 48px; border-radius: 999px; background: var(--bg2); display: grid; place-items: center; font-family: var(--f-d); font-size: 20px; }
.conn { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.conn-n { font-weight: 600; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.err-t { color: var(--err); font-weight: 600; }
.abo { background: var(--anth); color: #F4F8F0; border-radius: var(--r-lg); padding: 20px; }
.abo-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.abo-bars { display: flex; flex-direction: column; gap: 10px; }
.qbar-l { display: flex; justify-content: space-between; font-size: 13px; }
.abo .muted { color: var(--on-dark2); }
.qbar-t { height: 8px; background: rgba(255,255,255,.12); border-radius: 999px; overflow: hidden; margin-top: 4px; }
.qbar-f { height: 100%; border-radius: 999px; }
.link-row { display: flex; justify-content: space-between; align-items: center; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 14px 2px; text-align: left; font-weight: 600; min-height: 48px; }
.link-row.danger { color: var(--err); }
.foot-note { font-size: 12px; color: var(--muted); text-align: center; }

.tgl { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.tgl input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.tgl-track { width: 48px; height: 28px; background: var(--line); border-radius: 999px; position: relative; transition: background .15s; }
.tgl-knob { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 999px; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.tgl input:checked + .tgl-track { background: var(--green); }
.tgl input:checked + .tgl-track .tgl-knob { transform: translateX(20px); }
.tgl input:focus-visible + .tgl-track { outline: 3px solid var(--green); outline-offset: 2px; }

/* Tabbar, Toast */
.tabbar { flex: 0 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--surface); padding: 6px 8px 22px; }
.tabbar button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--text2); min-height: 52px; border-radius: 12px; }
.tabbar button.on { color: var(--anth); background: var(--bg2); }
.tab-i { font-size: 20px; position: relative; }
.dot { position: absolute; top: -4px; right: -14px; background: var(--green); color: var(--anth); font-size: 10px; border-radius: 999px; padding: 1px 6px; font-weight: 700; }
.toast { position: absolute; left: 20px; right: 20px; bottom: 96px; background: var(--anth); color: #F4F8F0; padding: 12px 16px; border-radius: var(--r-md); font-weight: 600; text-align: center; z-index: 60; box-shadow: var(--shadow); animation: up .2s ease-out; }
@keyframes up { from { transform: translateY(10px); opacity: .6; } to { transform: none; opacity: 1; } }

/* Modale */
.full { position: absolute; inset: 0; background: var(--bg); z-index: 20; display: flex; flex-direction: column; padding-top: 48px; animation: up .2s ease-out; }
.full-head { display: flex; align-items: center; gap: 8px; padding: 4px 16px 8px; }
.full-title { flex: 1; text-align: center; font-weight: 600; font-size: 16px; }
.full-body { flex: 1; overflow-y: auto; padding: 4px 20px 24px; display: flex; flex-direction: column; gap: 14px; }
.full-foot { padding: 12px 20px 28px; border-top: 1px solid var(--line); background: var(--surface); }
.sheet-wrap { position: absolute; inset: 0; background: rgba(30,44,49,.4); z-index: 30; display: flex; align-items: flex-end; }
.sheet { width: 100%; max-height: 88%; background: var(--bg); border-radius: 24px 24px 0 0; display: flex; flex-direction: column; animation: up .2s ease-out; }
.grab { width: 40px; height: 5px; background: var(--line); border-radius: 999px; margin: 8px auto 0; }
.sheet-head { display: flex; align-items: center; padding: 6px 16px 4px 20px; }
.sheet-title { flex: 1; font-family: var(--f-d); font-size: 20px; font-weight: 600; }
.sheet-body { overflow-y: auto; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 12px; }
.sheet-foot { padding: 12px 20px 28px; border-top: 1px solid var(--line); }
.dialog-wrap { position: absolute; inset: 0; background: rgba(30,44,49,.5); z-index: 40; display: grid; place-items: center; padding: 24px; }
.dialog { background: var(--surface); border-radius: var(--r-lg); padding: 22px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); width: 100%; }
.dialog-title { font-family: var(--f-d); font-size: 20px; font-weight: 600; }
.dialog-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

/* KI */
.brief { position: relative; }
.brief .input { padding-right: 56px; }
.mic { position: absolute; right: 8px; bottom: 8px; width: 44px; height: 44px; border-radius: 999px; border: 0; background: var(--green); font-size: 18px; }
.mic.sm { bottom: 2px; width: 44px; height: 44px; }
.mic.rec { background: var(--err); animation: pulse 1s infinite; }
@keyframes pulse { 50% { transform: scale(1.08); } }
.brief.locked .input { filter: blur(1px); }
.lock { position: absolute; inset: 0; background: rgba(244,248,240,.85); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-weight: 600; text-align: center; padding: 12px; }
.seg { display: flex; background: var(--bg2); border-radius: 999px; padding: 4px; }
.seg button { flex: 1; border: 0; background: none; padding: 10px 6px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--text2); min-height: 40px; }
.seg button.on { background: var(--anth); color: #F4F8F0; }
.understood { display: flex; flex-direction: column; gap: 8px; }
.u-row { display: flex; align-items: center; gap: 10px; }
.u-day { width: 96px; flex: 0 0 96px; font-size: 12px; font-weight: 600; color: var(--link); text-transform: uppercase; letter-spacing: .06em; }
.question { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.q-h { display: flex; gap: 10px; align-items: center; font-weight: 600; }
.progress { display: flex; flex-direction: column; gap: 10px; padding: 40px 12px; align-items: flex-start; }
.progress .bubble { align-self: center; margin-bottom: 16px; }
.prog-row { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 16px; }
.prog-row.now { color: var(--text); font-weight: 600; }
.prog-row.done { color: var(--badge); }
.prog-dot { width: 26px; height: 26px; border-radius: 999px; background: var(--bg2); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.prog-row.done .prog-dot { background: var(--green); color: var(--anth); }
.loading { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 48px 12px; font-weight: 600; text-align: center; }
.bubble .b1, .bubble .b2, .bubble .b3 { animation: blink 1.2s infinite; }
.bubble .b2 { animation-delay: .2s; } .bubble .b3 { animation-delay: .4s; }
@keyframes blink { 50% { opacity: .35; } }
.prop-day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 14px; }
.prop-d { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
.prop-row { display: flex; gap: 10px; align-items: baseline; padding: 3px 0; font-size: 14px; }
.prop-l { width: 52px; flex: 0 0 52px; font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: 600; letter-spacing: .06em; }
.prop-n { flex: 1; min-width: 0; font-weight: 600; }
.prop-n em { font-style: normal; font-weight: 400; color: var(--link); }
.summary { background: var(--bg2); border-radius: var(--r-md); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.sum-h { font-family: var(--f-d); font-size: 18px; font-weight: 600; }
.nutri { display: flex; height: 16px; border-radius: 999px; overflow: hidden; }
.chat { display: flex; flex-direction: column; gap: 6px; }
.msg { padding: 10px 14px; border-radius: 16px; font-size: 14px; max-width: 85%; }
.msg.me { align-self: flex-end; background: var(--green); color: var(--anth); border-bottom-right-radius: 4px; }
.msg.ai { align-self: flex-start; background: var(--anth); color: #F4F8F0; border-bottom-left-radius: 4px; }
.diff { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.diff-k { font-size: 12px; font-weight: 700; color: var(--link); text-transform: uppercase; letter-spacing: .06em; }
.diff-old { color: var(--err); text-decoration: line-through; }
.diff-new { color: var(--badge); font-weight: 600; }

/* Rezept */
.hero-img { height: 180px; border-radius: var(--r-lg); background: var(--bg2); display: grid; place-items: center; font-size: 84px; }
.stepper { display: inline-flex; align-items: center; gap: 10px; background: var(--bg2); border-radius: 999px; padding: 4px; }
.stepper button { width: 36px; height: 36px; border-radius: 999px; border: 0; background: var(--surface); font-size: 18px; font-weight: 700; }
.stepper span { min-width: 40px; text-align: center; font-weight: 600; }
.stepper-row { display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
.ing { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.ing.unsure { background: var(--warn-bg); border-radius: 8px; padding-inline: 8px; }
.ing-q { width: 96px; flex: 0 0 96px; color: var(--text2); }
.step { display: flex; gap: 12px; padding: 8px 0; }
.step-n { width: 28px; height: 28px; flex: 0 0 28px; border-radius: 999px; background: var(--anth); color: var(--mint); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.step-n.sm { width: 22px; height: 22px; flex-basis: 22px; font-size: 11px; display: inline-grid; margin-right: 8px; }
.skel { background: linear-gradient(90deg, var(--bg2), #EEF5E9, var(--bg2)); background-size: 200% 100%; border-radius: 8px; animation: sh 1.2s infinite; }
.skel-card { background: var(--surface); border-radius: var(--r-md); padding: 16px; display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--line); }
@keyframes sh { to { background-position: -200% 0; } }

/* Import */
.ing-edit { display: grid; grid-template-columns: 64px 80px 1fr; gap: 6px; }
.ing-edit .input { padding: 10px; min-height: 44px; }
.ing-edit.unsure .input { background: var(--warn-bg); border-color: #E9D78E; }
.unsure-t { grid-column: 1 / -1; font-size: 12px; color: var(--warn); font-weight: 600; }
.unsure-b { background: var(--warn-bg); }
.cam { height: 300px; border-radius: var(--r-lg); background: #3A4A4F; color: #DDE7E2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-weight: 600; }
.cam-frame { width: 70%; height: 65%; border: 3px dashed rgba(255,255,255,.5); border-radius: 12px; }
.thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.thumb { height: 64px; border-radius: 12px; border: 2px dashed var(--line); display: grid; place-items: center; color: var(--muted); font-size: 13px; font-weight: 600; }
.thumb.on { background: var(--anth); color: var(--mint); border: 0; }
.conv { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.conv.off { opacity: .5; }
.conv.off .conv-c > div:first-child { text-decoration: line-through; }
.conv-o { padding: 10px 14px; font-size: 14px; color: var(--text2); background: var(--bg2); }
.conv-c { padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; font-weight: 600; }
.hint { color: var(--warn); font-weight: 400; }
.input.q { width: 90px; min-height: 36px; padding: 6px 8px; }
.theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.theme { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r-md); padding: 12px; display: flex; flex-direction: column; gap: 4px; text-align: left; min-height: 120px; }
.theme.on { border-color: var(--green); background: var(--ok-bg); }
.theme-e { font-size: 24px; }
.theme-t { font-weight: 700; line-height: 1.25; }
.res { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; cursor: pointer; }
.res input { width: 22px; height: 22px; accent-color: var(--green); margin-top: 2px; }

/* Paywall */
.pw-trigger { background: var(--warn-bg); color: var(--warn); font-weight: 700; padding: 12px 14px; border-radius: var(--r-md); }
.plan { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.plan.on { border-color: var(--green); }
.plan.dark { background: var(--anth); color: #F4F8F0; border-color: var(--anth); }
.plan.dark.on { border-color: var(--green); }
.plan:disabled { opacity: .7; cursor: default; }
.plan-top { display: flex; align-items: center; gap: 8px; }
.plan-n { font-family: var(--f-d); font-size: 22px; font-weight: 600; }
.plan-p { margin-left: auto; font-weight: 700; }
.ticks { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.ticks li::before { content: '✓ '; color: var(--green); font-weight: 700; }
.ticks.on-dark { color: var(--on-dark2); }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: center; }
.tbl td:first-child, .tbl th:first-child { text-align: left; }
.legal { font-size: 12px; text-align: center; color: var(--muted); }
.legal a { color: var(--link); }
.kv { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); }

/* Sheets klein */
.slotgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sg { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: left; display: flex; flex-direction: column; gap: 2px; min-height: 64px; }
.share { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.share-i { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; }
.share-i span { width: 56px; height: 56px; border-radius: 16px; background: var(--bg2); display: grid; place-items: center; font-size: 26px; }
.radio, .check-row { display: flex; gap: 10px; align-items: center; font-size: 15px; flex-wrap: wrap; }
.radio input, .check-row input { width: 20px; height: 20px; accent-color: var(--green); }
.radio.big { padding: 12px; background: var(--surface); border-radius: 12px; border: 1px solid var(--line); }

/* Onboarding */
.onb { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.onb-top { display: flex; align-items: center; justify-content: space-between; padding: 4px 16px; }
.dots { display: flex; gap: 6px; }
.dots span { width: 28px; height: 6px; border-radius: 999px; background: var(--line); }
.dots span.on { background: var(--green); }
.onb-body { flex: 1; overflow-y: auto; padding: 8px 24px 32px; display: flex; flex-direction: column; gap: 14px; }
.welcome { display: flex; flex-direction: column; gap: 18px; align-items: flex-start; padding-top: 48px; }
.ocard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.ocard-h { font-weight: 700; display: flex; gap: 8px; align-items: center; }
.ai-card .bubble path { fill: rgba(255,255,255,.12); }

/* Kalender-Agenda im Briefing */
.agenda { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.agenda.locked .ag { filter: blur(1.5px); }
.agenda-h { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-size: 14px; padding: 0 2px 2px; }
.ag { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; min-height: 52px; }
.ag:hover:not(:disabled) { border-color: var(--mint); }
.ag.on { background: var(--ok-bg); border-color: var(--green); }
.ag:disabled { opacity: 1; }
.ag-d { width: 30px; flex: 0 0 30px; font-weight: 700; font-size: 13px; color: var(--link); }
.ag-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ag-t { font-weight: 600; font-size: 14px; line-height: 1.3; }
.ag-w { font-size: 12px; color: var(--text2); font-variant-numeric: tabular-nums; }
.ag-add { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 999px; display: grid; place-items: center; background: var(--bg2); font-weight: 700; color: var(--anth); }
.ag.on .ag-add { background: var(--green); }
.agenda-h { align-items: center; gap: 8px; }
.ag-all { border: 0; background: var(--anth); color: #F4F8F0; font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 999px; min-height: 36px; white-space: nowrap; }

/* Manuell planen */
.open-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.open-top { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.open-bar { height: 6px; background: var(--bg2); border-radius: 999px; overflow: hidden; }
.open-bar > div { height: 100%; background: var(--green); border-radius: 999px; transition: width .2s; }
.walk { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--text2); }
.slot-ev { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; font-weight: 600; font-size: 14px; }
.slot-ev .small { font-weight: 400; }
.fixed-opts { display: flex; gap: 8px; }
.fo { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; font-size: 14px; }
.fo.hl { border-color: var(--green); background: var(--ok-bg); }
.rule-line { font-size: 12px; color: var(--text2); }
.rrow.warned { border-color: #E9D78E; }
.warn-t { font-size: 12px; color: var(--warn); font-weight: 600; margin-top: 2px; }
.empty.sm { padding: 16px 8px; }
.prop-row.kept { opacity: .55; }
.sheet-body > *, .full-body > * { flex-shrink: 0; }
.mini.half { background: linear-gradient(180deg, var(--mint) 50%, var(--bg2) 50%); color: var(--anth); }

</style>
