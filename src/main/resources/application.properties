# ---------- HTTP ----------
quarkus.http.port=${PORT:8080}
# Seite und API laufen auf derselben Domain: kein CORS-Filter nötig (er würde sonst eigene POSTs mit 403 ablehnen).
# Hinter dem Railway-Proxy die weitergeleiteten Header auswerten.
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.enable-forwarded-host=true

# ---------- Datenbank (Railway-Postgres liefert PGHOST, PGPORT, ...) ----------
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
%prod.quarkus.datasource.username=${PGUSER}
%prod.quarkus.datasource.password=${PGPASSWORD}
quarkus.hibernate-orm.database.generation=update

# ---------- Umfrage ----------
# Token für /api/responses, /api/responses.csv und /api/stats. Ohne Token sind diese Endpunkte gesperrt.
survey.admin-token=${ADMIN_TOKEN:}
survey.rate-limit.per-hour=${RATE_LIMIT_PER_HOUR:5}

# ---------- Mail via Resend ----------
notify.resend.api-key=${RESEND_API_KEY:}
notify.to=${NOTIFY_TO:}
notify.from=${NOTIFY_FROM:Menüplan Umfrage <onboarding@resend.dev>}

# ---------- Tests (H2 im Speicher, kein Docker nötig) ----------
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:survey;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.survey.admin-token=test-token
%test.survey.rate-limit.per-hour=3
